name: Build and audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore and audit NuGet packages
        run: >-
          dotnet restore Hawdh.Platform.slnx
          -p:NuGetAudit=true
          -p:NuGetAuditLevel=low
          -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904%3BNU1905

      - name: Validate PostgreSQL operation scripts
        run: bash -n deploy/backup-postgres.sh deploy/restore-postgres.sh

      - name: Validate production Compose configuration
        run: docker compose --env-file deploy/.env.production.example --file docker-compose.production.yml config --quiet

      - name: Build Release
        run: dotnet build Hawdh.Platform.slnx --configuration Release --no-restore

      - name: Run integration tests
        run: dotnet test Hawdh.Platform.slnx --configuration Release --no-build

      - name: Build production container
        run: docker build --tag hawdh-portal:ci --file src/web/Hawdh.Portal/Dockerfile src/web/Hawdh.Portal
