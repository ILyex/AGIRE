name: Release AGIRE for Windows

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build local Windows package
        shell: pwsh
        run: .\deploy\local-windows\Publish-HawdhLocal.ps1 -OutputDirectory .\artifacts\AGIRE-local-win-x64
      - name: Create archive and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path .\artifacts\AGIRE-local-win-x64\* -DestinationPath .\artifacts\AGIRE-local-win-x64.zip -CompressionLevel Optimal
          (Get-FileHash .\artifacts\AGIRE-local-win-x64.zip -Algorithm SHA256).Hash.ToLower() | Set-Content .\artifacts\AGIRE-local-win-x64.zip.sha256 -NoNewline
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/AGIRE-local-win-x64.zip
            artifacts/AGIRE-local-win-x64.zip.sha256
